<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">M1 manufacturing test platform software integration</title>
  <desc id="desc">Software and hardware integration architecture for the M1 manufacturing test platform. React Operator UI communicates with the M1TFC REST server over HTTP. The REST server invokes M1TFC. M1TFC controls the M1 Test Board and ACM Test Board via USB Hub and SAM-E Ethernet switch, delivering power, PoE, interface testing, and voltage measurements to the mnplus UUT over pogo pins.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b87"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#177451"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a85616"/></marker>
    <style>
      .title { fill: #15323d; font-family: sans-serif; font-size: 30px; font-weight: 700; }
      .sub { fill: #4d6870; font-family: sans-serif; font-size: 16px; }
      .lane { fill: #4d6870; font-family: sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .box { fill: #15323d; font-family: sans-serif; font-size: 21px; font-weight: 700; }
      .role { fill: #31505a; font-family: sans-serif; font-size: 14px; font-weight: 600; }
      .body { fill: #31505a; font-family: sans-serif; font-size: 14px; }
      .label { fill: #31505a; font-family: sans-serif; font-size: 13px; font-weight: 700; }
      .small { fill: #4d6870; font-family: sans-serif; font-size: 12px; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f7faf9"/>
  <text x="55" y="55" class="title">M1 Manufacturing Test Platform: System Architecture</text>
  <text x="55" y="84" class="sub">Complete software and hardware integration view for M1 Test Board, ACM, and mnplus UUT.</text>

  <!-- OPERATOR WORKSTATION -->
  <text x="55" y="132" class="lane">OPERATOR WORKSTATION</text>
  <rect x="55" y="152" width="350" height="174" rx="6" fill="#e6f2f5" stroke="#83afb9" stroke-width="2"/>
  <text x="85" y="193" class="box">Operator UI</text>
  <text x="85" y="220" class="role">React production/debug app</text>
  <text x="85" y="248" class="body">Starts test sequences</text>
  <text x="85" y="273" class="body">Displays status and live logs</text>
  <text x="85" y="301" class="small">Endpoint: http://127.0.0.1:3300</text>

  <!-- FIXTURE PC SOFTWARE & CONTROLLERS -->
  <text x="450" y="132" class="lane">FIXTURE PC & CONTROLLERS</text>
  <rect x="450" y="152" width="540" height="382" rx="6" fill="#e6f2f5" stroke="#83afb9" stroke-width="2"/>
  
  <rect x="480" y="196" width="220" height="110" rx="5" fill="#fff" stroke="#176b87" stroke-width="2"/>
  <text x="500" y="230" class="box">REST Server</text>
  <text x="500" y="255" class="role">HTTP API Server</text>
  <text x="500" y="280" class="small">Bind: 0.0.0.0:3300</text>

  <rect x="740" y="196" width="220" height="110" rx="5" fill="#fff" stroke="#176b87" stroke-width="2"/>
  <text x="760" y="230" class="box">M1TFC CLI</text>
  <text x="760" y="255" class="role">Test Orchestrator</text>
  <text x="760" y="280" class="small">Sequencing & limits</text>

  <path d="M405 239 H480" fill="none" stroke="#176b87" stroke-width="3" marker-end="url(#blue)"/>
  <text x="415" y="225" class="label">HTTP JSON</text>

  <path d="M700 251 H740" fill="none" stroke="#176b87" stroke-width="3" marker-end="url(#blue)"/>
  <text x="705" y="240" class="label">sudo -n</text>

  <!-- INTERFACES & HARDWARE -->
  <rect x="480" y="345" width="220" height="160" rx="5" fill="#fff" stroke="#a85616" stroke-width="2"/>
  <text x="500" y="375" class="box">USB Hub & SAM-E</text>
  <text x="500" y="400" class="role">Internal Interfaces</text>
  <text x="500" y="425" class="body">Back Panel USB-B -> USB Hub</text>
  <text x="500" y="450" class="body">Back Panel ETH -> SAM-E</text>
  <text x="500" y="475" class="small">SAM-E: 3-Port Switch</text>

  <rect x="740" y="345" width="220" height="160" rx="5" fill="#fff" stroke="#177451" stroke-width="2"/>
  <text x="760" y="375" class="box">M1 Test Board</text>
  <text x="760" y="400" class="role">Fixture Controller</text>
  <text x="760" y="425" class="body">12V DC Input</text>
  <text x="760" y="450" class="body">Control Signal -> 48V Relay</text>
  <text x="760" y="475" class="small">USB -> USB Hub</text>

  <path d="M850 306 V345" fill="none" stroke="#176b87" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M590 306 V345" fill="none" stroke="#176b87" stroke-width="3" marker-end="url(#blue)"/>

  <!-- HARDWARE / UUT -->
  <text x="1030" y="132" class="lane">HARDWARE & UUT</text>
  <rect x="1030" y="152" width="415" height="382" rx="6" fill="#fdf8f3" stroke="#d49b6a" stroke-width="2"/>

  <rect x="1060" y="196" width="355" height="110" rx="5" fill="#fff" stroke="#a85616" stroke-width="2"/>
  <text x="1080" y="230" class="box">ACM Test Board</text>
  <text x="1080" y="255" class="role">12V DC Input</text>
  <text x="1080" y="280" class="body">Ethernet Cable -> SAM-E Switch</text>

  <rect x="1060" y="345" width="355" height="160" rx="5" fill="#fff" stroke="#a85616" stroke-width="2"/>
  <text x="1080" y="375" class="box">mnplus UUT Target</text>
  <text x="1080" y="400" class="role">Unit Under Test</text>
  <text x="1080" y="425" class="body">PoE Input (over pogo-pins)</text>
  <text x="1080" y="450" class="body">M1 Power & Harness (over pogo-pins)</text>
  <text x="1080" y="475" class="body">ACM Connection (over pogo-pins)</text>

  <path d="M700 425 H1060" fill="none" stroke="#a85616" stroke-width="3" marker-end="url(#orange)"/>
  <path d="M960 425 H1060" fill="none" stroke="#177451" stroke-width="3" marker-end="url(#green)"/>
  <path d="M1237 306 V345" fill="none" stroke="#a85616" stroke-width="3" marker-end="url(#orange)"/>

  <!-- SCHEDULED OPERATIONS -->
  <text x="55" y="596" class="lane">FIXTURE PC: SCHEDULED OPERATIONS</text>
  <rect x="55" y="616" width="1390" height="176" rx="6" fill="#edf7f2" stroke="#79ab95" stroke-width="2"/>
  <rect x="95" y="652" width="390" height="104" rx="5" fill="#fff" stroke="#177451" stroke-width="2"/>
  <text x="120" y="688" class="box">tfcroncli / m1client</text>
  <text x="120" y="714" class="role">Scheduled Fixture-PC app</text>
  <text x="120" y="738" class="body">Cloud communication, logs, secrets, updates</text>

  <rect x="1000" y="652" width="395" height="104" rx="5" fill="#fff" stroke="#177451" stroke-width="2"/>
  <text x="1025" y="688" class="box">Cloud / Release Services</text>
  <text x="1025" y="714" class="role">Remote operational endpoint</text>
  <text x="1025" y="738" class="body">Artifact retrieval & status exchange</text>

  <path d="M485 704 H1000" fill="none" stroke="#177451" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/>

  <rect x="55" y="838" width="1390" height="1" fill="#b9c8c9"/>
  <text x="55" y="865" class="small">Reflects full hardware and software architecture including M1 Test Board, ACM Test Board, SAM-E Ethernet switch, USB Hub, 48V PoE Relay, and mnplus UUT pogo-pin interfaces.</text>
</svg>
