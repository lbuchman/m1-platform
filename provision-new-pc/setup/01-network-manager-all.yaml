# Ubuntu Server default backend is systemd-networkd (NetworkManager is not
# installed by default on Server images, only on Desktop).
# NOTE: this is a template. setup.sh auto-detects the real interface names on
# the target machine (they vary between PCs) via `ip link` and substitutes
# them in place of the __..._IF__ placeholders below before installing this
# file to /etc/netplan.
network:
  version: 2
  renderer: networkd
  ethernets:
    __Internet:
      dhcp4: yes
    __TestFixture:
      dhcp4: no
      optional: true
      addresses: [192.168.0.100/24]
